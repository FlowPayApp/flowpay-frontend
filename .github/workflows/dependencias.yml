name: Dependencias

on:
  push:
  pull_request:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  altas:
    name: Vulnerabilidades altas o críticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
